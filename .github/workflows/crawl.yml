name: Weekly snapshot

# 02:17 UTC rather than on the hour: scheduled runs bunch up at :00 and get delayed.
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m cdrintel crawl
      - name: Commit the snapshot
        run: |
          git config user.name "snapshot bot"
          git config user.email "noreply@github.com"
          git add data/snapshots.sqlite
          git diff --staged --quiet || git commit -m "snapshot $(date -u +%Y-%m-%d)"
          git push
